<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>동영상 연속재생</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* ===== 설정: 아래 따옴표 안에 발급받은 YouTube Data API 키를 넣으세요 ===== */
const API_KEY = 'AIzaSyCgvn4PnbECbowfQ_Z8hOLWj6fFgrITNpA';
/* ======================================================================== */

// 카카오톡 등 앱 내장 브라우저에서 열면 기본 브라우저로 다시 열기
(function(){
  const ua = navigator.userAgent;
  if (/KAKAOTALK/i.test(ua)) {
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  }
})();
</script>
<style>
:root{--bg:#EEF1F6;--panel:#fff;--ink:#18202E;--muted:#5B6576;--line:#D5DBE5;--accent:#D6204A;--accent-ink:#fff;--warn:#9A5B00;--warn-bg:#FFF3DC;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12161F;--panel:#1B212D;--ink:#E9EDF4;--muted:#9AA4B5;--line:#2E3747;--accent:#FF4D6D;--accent-ink:#1A0A10;--warn:#F2B560;--warn-bg:#35291A}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6}
main{max-width:1240px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.row{display:flex;gap:8px;max-width:600px}
input[type=text],input[type=search]{flex:1;min-width:0;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
input[type=text]:focus,input[type=search]:focus{outline:none;border-color:var(--accent)}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.go{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 18px}
.order{display:flex;gap:18px;margin-top:12px;font-size:.95rem;flex-wrap:wrap}
.order label{display:flex;align-items:center;gap:6px;cursor:pointer}
.order input{accent-color:var(--accent);width:18px;height:18px}
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:.92rem;max-width:600px}
.msg a{color:inherit;font-weight:700}
.wrap{display:grid;gap:20px;margin-top:18px}
@media (min-width:860px){ .wrap{grid-template-columns:minmax(0,1fr) 380px;align-items:start} }
.stage{margin:0 auto;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.stage > *{width:100%;height:100%;display:block}
.chan{text-align:center;font-weight:500;margin-top:10px}
#now{text-align:center;color:var(--muted);font-size:.85rem}
.ctrl{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.ctrl button{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);padding:9px 16px}
.ctrl .share{border-color:var(--accent);color:var(--accent);font-weight:500}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.list-head span{color:var(--muted);font-size:.85rem}
.views{display:flex;gap:4px}
.views button,.refresh{background:none;border:1.5px solid var(--line);color:var(--muted);padding:3px 10px;font-size:.8rem;border-radius:8px}
.views button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow-y:auto;max-height:72vh;padding:2px}
.card{background:none;padding:0;text-align:left;color:var(--ink);border-radius:10px;display:flex;flex-direction:column;gap:4px}
.card .th{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--line)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;font-size:.72rem;padding:1px 6px;border-radius:6px}
.card .tx{min-width:0}
.card .tt{font-size:.75rem;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .dt{display:none;font-size:.75rem;color:var(--muted)}
.card .rn{display:none;width:2.6em;flex:none;text-align:right;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.card.cur .th{outline:3px solid var(--accent);outline-offset:-3px}
.card.cur .tt{color:var(--ink);font-weight:500}
.grid.rows{grid-template-columns:1fr;gap:2px}
.grid.rows .card{flex-direction:row;align-items:center;gap:12px;padding:6px}
.grid.rows .card:hover,.grid.rows .card.cur{background:var(--bg)}
.grid.rows .card .th{width:96px;flex:none;border-radius:6px}
.grid.rows .card .no{display:none}
.grid.rows .card .rn,.grid.rows .card .dt{display:block}
.grid.rows .card .tt{font-size:.9rem;color:var(--ink)}
.grid.rows .card.cur .th{outline-width:2px;outline-offset:-2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<main>
  <h1>동영상 연속재생</h1>
  <p class="lead">채널 주소(@핸들), 채널 ID, 또는 그 채널의 동영상 주소를 넣으면 쇼츠와 라이브를 뺀 일반 동영상 전체를 이어서 재생합니다.</p>
  <div class="row">
    <input id="inp" type="text" autocomplete="off" spellcheck="false" placeholder="@채널명, UC… 채널 ID, 동영상 주소">
    <button class="go" id="go">불러오기</button>
  </div>
  <div class="order">
    <label><input type="radio" name="order" value="new" checked> 최신순</label>
    <label><input type="radio" name="order" value="date"> 날짜순</label>
  </div>
  <div id="msg"></div>

  <div class="wrap" id="area" hidden>
    <div>
      <div class="stage"><div id="player"></div></div>
      <div class="chan" id="chan"></div>
      <div id="now"></div>
      <div class="ctrl">
        <button id="prev">◀ 이전</button>
        <button id="next">다음 ▶</button>
        <button class="share" id="share">이 채널 링크 공유</button>
      </div>
    </div>
    <section class="list">
      <div class="list-head">
        <div><b>전체 동영상</b> <span id="count"></span></div>
        <div class="views" role="group" aria-label="보기 방식">
          <button data-view="grid" aria-pressed="true">격자</button>
          <button data-view="rows" aria-pressed="false">목록</button>
          <button class="refresh" id="refresh" title="목록을 새로 불러옵니다">새로고침</button>
        </div>
      </div>
      <input id="q" type="search" placeholder="제목으로 찾기">
      <div class="grid" id="grid"></div>
    </section>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const API='https://www.googleapis.com/youtube/v3/';
const CACHE_HOURS=6;
let channel=null, videos=[], curId=null, player=null, apiReady=false, pendingId=null, errStreak=0;

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>d?d.slice(0,10).replace(/-/g,'.'):'';
const getOrder=()=>document.querySelector('input[name=order]:checked').value;
const setOrder=v=>{const el=document.querySelector(`input[name=order][value="${v}"]`); if(el) el.checked=true;};
const orderLabel=()=>getOrder()==='date'?'날짜순':'최신순';
function showMsg(html){ $('#msg').innerHTML = html ? `<div class="msg">${html}</div>` : ''; }
let tt; function toast(m){const el=$('#toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2400)}

async function api(path, params){
  const u=new URL(API+path);
  Object.entries({...params,key:API_KEY}).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u); const j=await r.json();
  if(j.error){ const e=new Error(j.error.message); e.reason=(j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||''; throw e; }
  return j;
}

// 입력값 → 채널 ID(UC…)와 채널 이름
async function resolveChannel(raw){
  const s=raw.trim();
  let m=s.match(/\bUC([A-Za-z0-9_-]{22})\b/)||s.match(/\bUU(?:SH|LF|LV)?([A-Za-z0-9_-]{22})\b/);
  let j;
  if(m) j=await api('channels',{part:'snippet',id:'UC'+m[1]});
  else if((m=s.match(/@([^\/\s?#]+)/))) j=await api('channels',{part:'snippet',forHandle:'@'+decodeURIComponent(m[1])});
  else if((m=s.match(/(?:\/shorts\/|youtu\.be\/|[?&]v=)([A-Za-z0-9_-]{11})/))){
    const v=await api('videos',{part:'snippet',id:m[1]});
    if(!v.items||!v.items.length) throw new Error('영상을 찾지 못했어요.');
    j=await api('channels',{part:'snippet',id:v.items[0].snippet.channelId});
  } else throw new Error('채널 주소, @핸들, 채널 ID 또는 동영상 주소를 넣어 주세요.');
  if(!j.items||!j.items.length) throw new Error('채널을 찾지 못했어요.');
  return {id:j.items[0].id, title:j.items[0].snippet.title};
}

// 동영상 전체 목록 (50개씩 끝까지)
async function fetchAllShorts(uc, force){
  const key='videos-cache:'+uc;
  if(!force){ try{ const c=JSON.parse(localStorage.getItem(key)); if(c && Date.now()-c.at < CACHE_HOURS*3600e3) return c.items; }catch(_){} }
  const list='UULF'+uc.slice(2); let token='', out=[];
  do{
    const j=await api('playlistItems',{part:'snippet,contentDetails',playlistId:list,maxResults:50,...(token?{pageToken:token}:{})});
    for(const it of j.items||[]){
      const d=it.contentDetails&&it.contentDetails.videoPublishedAt;
      if(!d) continue; // 비공개·삭제 영상 제외
      out.push({id:it.contentDetails.videoId,t:it.snippet.title,d});
    }
    token=j.nextPageToken||'';
    $('#now').textContent=`동영상 목록 불러오는 중… ${out.length}개`;
  }while(token);
  try{ localStorage.setItem(key,JSON.stringify({at:Date.now(),items:out})); }catch(_){}
  return out;
}

const sorted=()=>videos.slice().sort((a,b)=>getOrder()==='date'? a.d.localeCompare(b.d) : b.d.localeCompare(a.d));

async function start(force){
  const raw=$('#inp').value; if(!raw.trim()) return;
  if(!API_KEY || API_KEY==='YOUR_API_KEY'){ showMsg('index.html 파일 맨 위의 <b>API_KEY</b>에 YouTube Data API 키가 아직 들어 있지 않아요.'); return; }
  showMsg(''); $('#go').disabled=true;
  try{
    channel=await resolveChannel(raw);
    $('#area').hidden=false; $('#chan').textContent=channel.title; $('#grid').innerHTML='';
    videos=await fetchAllShorts(channel.id, force);
    if(!videos.length){ showMsg('이 채널에는 재생할 수 있는 동영상가 없어요.'); $('#area').hidden=true; return; }
    const url=new URL(location.href); url.searchParams.set('c',channel.id); url.searchParams.set('o',getOrder()); history.replaceState(null,'',url);
    renderList();
    if(!force || !curId) playId(sorted()[0].id);
  }catch(e){
    if(e.reason==='playlistNotFound') showMsg('이 채널에는 동영상가 없거나 목록을 찾을 수 없어요.');
    else if(/API key|referer|referrer|blocked/i.test(e.message)) showMsg('API 키가 올바르지 않거나 이 주소에서 사용하도록 허용되지 않았어요. 키 설정의 웹사이트 제한을 확인해 주세요.');
    else if(e.reason==='quotaExceeded') showMsg('오늘 조회 한도를 다 썼어요. 내일 다시 시도해 주세요.');
    else showMsg(esc(e.message));
  }finally{ $('#go').disabled=false; }
}

function renderList(){
  const q=$('#q').value.trim().toLowerCase();
  const list=sorted();
  const html=[];
  list.forEach((v,i)=>{
    if(q && !v.t.toLowerCase().includes(q)) return;
    html.push(`<button class="card" data-id="${v.id}" title="${esc(v.t)}">
      <span class="rn">${i+1}</span>
      <div class="th"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt=""><span class="no">${i+1}</span></div>
      <div class="tx"><div class="tt">${esc(v.t)}</div><div class="dt">${fmtDate(v.d)}</div></div></button>`);
  });
  $('#grid').innerHTML=html.join('');
  $('#count').textContent=`${list.length}개 · ${orderLabel()}${q?` · 검색 ${html.length}개`:''}`;
  markCurrent(true);
}

function playId(id){
  curId=id; markCurrent(true); updateNow();
  if(!apiReady){ pendingId=id; return; }
  if(!player){
    player=new YT.Player('player',{
      videoId:id,
      playerVars:{playsinline:1,rel:0,autoplay:1,origin:location.origin},
      events:{
        onStateChange:e=>{
          if(e.data===YT.PlayerState.PLAYING){ errStreak=0; }
          if(e.data===YT.PlayerState.ENDED) step(1);
        },
        onError:e=>{
          errStreak++;
          if(errStreak>=3){ showMsg('영상이 계속 재생되지 않아요. 앱 안의 브라우저(카카오톡, 네이버 등)에서 열었다면 크롬·사파리 같은 기본 브라우저로 이 주소를 열어 주세요.'); return; }
          toast('재생할 수 없는 영상이라 건너뜁니다'); setTimeout(()=>step(1),900);
        }
      }
    });
  } else player.loadVideoById(id);
}

function step(dir){
  const list=sorted(); const i=list.findIndex(v=>v.id===curId);
  const n=i+dir;
  if(n<0){ toast('첫 번째 동영상입니다'); return; }
  if(n>=list.length){ toast('마지막 동영상까지 모두 재생했어요'); return; }
  playId(list[n].id);
}
function updateNow(){
  const list=sorted(); const i=list.findIndex(v=>v.id===curId);
  $('#now').textContent = i>=0 ? `${orderLabel()} · ${i+1} / ${list.length}` : '';
}
function markCurrent(scroll){
  document.querySelectorAll('.card.cur').forEach(c=>c.classList.remove('cur'));
  const c=curId && document.querySelector(`.card[data-id="${curId}"]`);
  if(c){ c.classList.add('cur'); if(scroll) c.scrollIntoView({block:'nearest'}); }
}

window.onYouTubeIframeAPIReady=()=>{ apiReady=true; if(pendingId){ const id=pendingId; pendingId=null; playId(id); } };

$('#grid').addEventListener('click',e=>{ const c=e.target.closest('.card'); if(c) playId(c.dataset.id); });
$('#go').onclick=()=>start(false);
$('#inp').addEventListener('keydown',e=>{ if(e.key==='Enter') start(false); });
$('#prev').onclick=()=>step(-1);
$('#next').onclick=()=>step(1);
$('#refresh').onclick=()=>{ if(channel){ $('#inp').value=channel.id; start(true); } };
$('#q').addEventListener('input',()=>renderList());
document.querySelectorAll('input[name=order]').forEach(r=>r.addEventListener('change',()=>{
  if(!videos.length) return;
  const url=new URL(location.href); url.searchParams.set('o',getOrder()); history.replaceState(null,'',url);
  renderList(); updateNow();
}));
$('#share').onclick=async()=>{
  const u=location.origin+location.pathname+'?c='+channel.id+'&o='+getOrder();
  try{ await navigator.clipboard.writeText(u); }
  catch(_){ const t=document.createElement('textarea'); t.value=u; document.body.appendChild(t); t.select(); try{document.execCommand('copy')}catch(_){} t.remove(); }
  toast('링크를 복사했어요');
};

function setView(v){
  $('#grid').classList.toggle('rows', v==='rows');
  document.querySelectorAll('.views [data-view]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.view===v));
  try{ localStorage.setItem('videos-view', v); }catch(_){}
  markCurrent(true);
}
document.querySelector('.views').addEventListener('click',e=>{ const b=e.target.closest('[data-view]'); if(b) setView(b.dataset.view); });
try{ const v=localStorage.getItem('videos-view'); if(v) setView(v); }catch(_){}

const qp=new URLSearchParams(location.search);
if(qp.get('o')) setOrder(qp.get('o')==='old'?'date':qp.get('o'));
if(qp.get('c')){ $('#inp').value=qp.get('c'); start(false); }

const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
</body>
</html>
